# 개발용 Postgres 만. web·server 는 호스트에서 실행.
# 호스트 포트는 POSTGRES_PORT (기본 5432).
name: chagokmoa-dev

services:
  postgres:
    image: postgres:17-alpine
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    environment:
      POSTGRES_USER: chagokmoa
      POSTGRES_PASSWORD: chagokmoa
      POSTGRES_DB: chagokmoa
    volumes:
      - ./data/postgres17:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U chagokmoa -d chagokmoa"]
      interval: 2s
      timeout: 3s
      retries: 30
