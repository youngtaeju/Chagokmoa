name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  server:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    defaults:
      run:
        working-directory: server
    env:
      DATABASE_URL: postgres://chagokmoa:chagokmoa@localhost:5432/chagokmoa
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: chagokmoa
          POSTGRES_PASSWORD: chagokmoa
          POSTGRES_DB: chagokmoa
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U chagokmoa"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7
      # 받은 .deb 파일을 Actions 캐시에 보관. 적중 시 apt 미러 접속 없음.
      # 목록이나 Ubuntu 버전 바뀌면 version 올림.
      # 복원 시 설치 스크립트 실행. ffmpeg 의존 libblas.so.3 는 update-alternatives 링크라 없으면 ffprobe 실행 실패.
      - name: 시스템 패키지 설치
        timeout-minutes: 10
        uses: awalsh128/cache-apt-pkgs-action@553a35bb8ebd9fcabcb1c9451aa4c98e1b4ca8a9 # v1.6.3
        with:
          packages: pkg-config zlib1g-dev libheif-dev libheif-plugin-libde265 libheif-plugin-aomenc libheif-plugin-dav1d ffmpeg
          version: ubuntu-24.04-1
          execute_install_scripts: true
      - uses: dtolnay/rust-toolchain@1.99
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: server
      - name: sqlx-cli 설치
        run: cargo install sqlx-cli --version 0.8.6 --locked --no-default-features --features postgres,rustls
      - name: fmt
        run: cargo fmt --check
      - name: 마이그레이션 적용
        run: cargo sqlx migrate run
      - name: clippy (오프라인 .sqlx 검증)
        run: cargo clippy --locked --all-targets -- -D warnings
        env:
          SQLX_OFFLINE: "true"
      - name: sqlx prepare 검사
        run: cargo sqlx prepare --check -- --all-targets
      - name: test
        run: cargo test --locked
      - name: OpenAPI 문서 신선도 검사
        run: cargo run -q --locked -- openapi > ../web/openapi.json && git diff --exit-code ../web/openapi.json

  web:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: web/package.json
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - name: 의존성 설치
        run: pnpm install --frozen-lockfile
      - name: lint
        run: pnpm lint
      - name: typecheck
        run: pnpm typecheck
      - name: test
        run: pnpm test
      - name: build
        run: pnpm build
      - name: 생성 타입 신선도 검사
        run: pnpm gen:api:check

  docker:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: 이미지 빌드
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/Dockerfile
          platforms: linux/amd64
          tags: chagokmoa:ci
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: 이미지 크기 기록
        run: |
          { echo '```'; docker image ls chagokmoa:ci; echo '```'; } | tee -a "$GITHUB_STEP_SUMMARY"
      - name: 스모크
        run: bash docker/smoke.sh chagokmoa:ci

  e2e:
    # docker job 이 채운 GHA 빌드 캐시 재사용. 같은 이미지 이중 빌드 방지.
    needs: docker
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      # docker job 과 같은 빌드. 캐시 기록은 docker job 만.
      - name: 이미지 빌드
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/Dockerfile
          platforms: linux/amd64
          tags: chagokmoa:ci
          load: true
          cache-from: type=gha
      - name: 스택 기동(빈 DB)
        run: bash docker/stack.sh up chagokmoa:ci
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: web/package.json
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - name: 의존성 설치
        working-directory: web
        run: pnpm install --frozen-lockfile
      # Playwright 공식 이미지(브라우저와 시스템 의존성 포함)에서 실행. 러너 apt 설치 없음.
      # node_modules 는 위 단계(러너) 설치분 재사용. 스택은 --network host 로 localhost:18090.
      # 이미지 태그는 web/package.json 의 @playwright/test 버전과 함께 올림.
      - name: e2e
        # 이미지 받기 정지 시 잡 제한(45분)까지 대기 방지. 정상 약 3분.
        timeout-minutes: 15
        run: |
          docker run --rm --network host --ipc host \
            --user "$(id -u):$(id -g)" -e HOME=/tmp -e CI=true \
            -v "$PWD:/src" -w /src/web \
            mcr.microsoft.com/playwright:v1.65.0-noble \
            npx --no-install playwright test
      - name: trace 업로드
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-traces
          path: web/test-results/
          retention-days: 7
      - name: 서버 로그
        if: failure()
        run: bash docker/stack.sh logs chagokmoa:ci
      - name: 스택 정리
        if: always()
        run: bash docker/stack.sh down chagokmoa:ci
