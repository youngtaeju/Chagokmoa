name: CI

on:
  push:
    branches: [main]
  pull_request:
  # 주 1회 CI 이미지 보안 갱신(같은 태그 재빌드) 겸 전체 검사.
  schedule:
    - cron: '23 18 * * 0'

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  # server 잡 전용 빌드 이미지. docker/ci.Dockerfile 내용 해시 태그가 없을 때만 빌드.
  # 같은 PR 에서 목록을 바꿔도 그 PR 의 server 잡이 새 이미지 사용.
  ci-image:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.tag.outputs.image }}
    steps:
      - uses: actions/checkout@v7
      - name: 태그 계산
        id: tag
        run: |
          hash="$(sha256sum docker/ci.Dockerfile | cut -c1-12)"
          echo "image=ghcr.io/${{ github.repository_owner }}/chagokmoa-ci:sha-${hash}" >> "$GITHUB_OUTPUT"
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # 예약 실행은 항상 다시 빌드(기반 이미지와 Debian 보안 갱신). 실패해도 기존 태그는 그대로.
      - name: 태그 존재 확인
        id: exists
        run: |
          if [ "${{ github.event_name }}" != "schedule" ] \
            && docker manifest inspect "${{ steps.tag.outputs.image }}" >/dev/null 2>&1; then
            echo "found=true" >> "$GITHUB_OUTPUT"
          else
            echo "found=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: docker/setup-buildx-action@v4
        if: steps.exists.outputs.found != 'true'
      - name: 빌드와 push
        if: steps.exists.outputs.found != 'true'
        uses: docker/build-push-action@v7
        with:
          context: docker
          file: docker/ci.Dockerfile
          platforms: linux/amd64
          push: true
          pull: ${{ github.event_name == 'schedule' }}
          no-cache: ${{ github.event_name == 'schedule' }}
          tags: ${{ steps.tag.outputs.image }}
          cache-from: type=gha,scope=ci-image
          cache-to: type=gha,scope=ci-image,mode=max

  server:
    needs: ci-image
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
      packages: read
    # 시스템 패키지, 툴체인, sqlx-cli 가 미리 든 이미지. 실행 중 apt 미러 접속 없음.
    container:
      image: ${{ needs.ci-image.outputs.image }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
      # 러너 사용자 uid. root 면 권한 거부를 확인하는 테스트가 건너뜀. 작업 디렉터리 소유자와도 같음.
      options: --user 1001
    defaults:
      run:
        working-directory: server
    env:
      # 컨테이너 잡은 서비스 이름으로 접속.
      DATABASE_URL: postgres://chagokmoa:chagokmoa@postgres:5432/chagokmoa
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: chagokmoa
          POSTGRES_PASSWORD: chagokmoa
          POSTGRES_DB: chagokmoa
        options: >-
          --health-cmd "pg_isready -U chagokmoa"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7
      # 컨테이너 안 사용자와 작업 디렉터리 소유자가 다를 때 대비. OpenAPI 검사의 git diff 용.
      - name: git safe.directory
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: server
      - name: fmt
        run: cargo fmt --check
      - name: 마이그레이션 적용
        run: cargo sqlx migrate run
      - name: clippy (오프라인 .sqlx 검증)
        run: cargo clippy --locked --all-targets -- -D warnings
        env:
          SQLX_OFFLINE: "true"
      - name: sqlx prepare 검사
        run: cargo sqlx prepare --check -- --all-targets
      - name: test
        run: cargo test --locked
      - name: OpenAPI 문서 신선도 검사
        run: cargo run -q --locked -- openapi > ../web/openapi.json && git diff --exit-code ../web/openapi.json

  web:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: web/package.json
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - name: 의존성 설치
        run: pnpm install --frozen-lockfile
      - name: lint
        run: pnpm lint
      - name: typecheck
        run: pnpm typecheck
      - name: test
        run: pnpm test
      - name: build
        run: pnpm build
      - name: 생성 타입 신선도 검사
        run: pnpm gen:api:check

  docker:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: 이미지 빌드
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/Dockerfile
          platforms: linux/amd64
          tags: chagokmoa:ci
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: 이미지 크기 기록
        run: |
          { echo '```'; docker image ls chagokmoa:ci; echo '```'; } | tee -a "$GITHUB_STEP_SUMMARY"
      - name: 스모크
        run: bash docker/smoke.sh chagokmoa:ci
      # 덤프와 복구 왕복은 이미지의 pg_dump 17 로(러너 클라이언트는 16).
      - name: 백업과 복구 왕복
        timeout-minutes: 10
        run: bash docker/backup-smoke.sh chagokmoa:ci

  e2e:
    # docker job 이 채운 GHA 빌드 캐시 재사용. 같은 이미지 이중 빌드 방지.
    needs: docker
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      # docker job 과 같은 빌드. 캐시 기록은 docker job 만.
      - name: 이미지 빌드
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/Dockerfile
          platforms: linux/amd64
          tags: chagokmoa:ci
          load: true
          cache-from: type=gha
      - name: 스택 기동(빈 DB)
        run: bash docker/stack.sh up chagokmoa:ci
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: web/package.json
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - name: 의존성 설치
        working-directory: web
        run: pnpm install --frozen-lockfile
      # Playwright 공식 이미지(브라우저와 시스템 의존성 포함)에서 실행. 러너 apt 설치 없음.
      # node_modules 는 위 단계(러너) 설치분 재사용. 스택은 --network host 로 localhost:18090.
      # 이미지 태그는 web/package.json 의 @playwright/test 버전과 함께 올림.
      - name: e2e
        # 이미지 받기 정지 시 잡 제한(45분)까지 대기 방지. 정상 약 3분.
        timeout-minutes: 15
        run: |
          docker run --rm --network host --ipc host \
            --user "$(id -u):$(id -g)" -e HOME=/tmp -e CI=true \
            -v "$PWD:/src" -w /src/web \
            mcr.microsoft.com/playwright:v1.65.0-noble \
            npx --no-install playwright test
      - name: trace 업로드
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-traces
          path: web/test-results/
          retention-days: 7
      - name: 서버 로그
        if: failure()
        run: bash docker/stack.sh logs chagokmoa:ci
      - name: 스택 정리
        if: always()
        run: bash docker/stack.sh down chagokmoa:ci
