name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/youngtaeju/chagokmoa

jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: write # GitHub Release 생성
      packages: write # GHCR push
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: 태그와 server/Cargo.toml 버전 일치 검사
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if ! [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "태그 형식이 vX.Y.Z 가 아닙니다: $TAG" >&2
            exit 1
          fi
          crate="$(sed -n 's/^version = "\(.*\)"$/\1/p' server/Cargo.toml | head -n1)"
          if [ "${TAG#v}" != "$crate" ]; then
            echo "태그($TAG)와 server/Cargo.toml 버전($crate)이 다릅니다." >&2
            exit 1
          fi
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: 태그와 라벨 계산
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest
          labels: |
            org.opencontainers.image.licenses=AGPL-3.0-only
      # 한 번 빌드해 태그 없이 digest 로 push. 스모크 통과한 그 digest 에만 태그.
      - name: 이미지 빌드와 digest push
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/Dockerfile
          platforms: linux/amd64
          labels: ${{ steps.meta.outputs.labels }}
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha
      # 스모크 실패 시 태그 없는 매니페스트만 남음(배포 안 됨).
      - name: 스모크(push 한 digest)
        env:
          REF: ${{ env.IMAGE }}@${{ steps.build.outputs.digest }}
        run: |
          docker pull "$REF"
          docker tag "$REF" chagokmoa:release
          bash docker/smoke.sh chagokmoa:release
      - name: digest 에 태그
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          set -euo pipefail
          args=()
          while IFS= read -r tag; do
            if [ -n "$tag" ]; then args+=(-t "$tag"); fi
          done <<<"$TAGS"
          docker buildx imagetools create "${args[@]}" "$IMAGE@$DIGEST"
      - name: GitHub Release 생성
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: gh release create "$TAG" --verify-tag --generate-notes --title "$TAG"
