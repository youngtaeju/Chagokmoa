<!doctype html>
<!--
  README 배너 원본. 로그인 화면(web/src/pages/AuthLayout.tsx, AuthBackdrop.tsx)의 라이트 장면.
  ko 는 banner.html, en 은 banner.html?lang=en. 글꼴과 아이콘은 web/ 의 파일 참조(pnpm install 필요).
  다시 만들기(web/ 에서):
    node -e "const{chromium}=require('@playwright/test');(async()=>{const b=await chromium.launch();const p=await b.newPage({deviceScaleFactor:2});for(const l of['ko','en']){await p.goto('file://'+require('path').resolve('../docs/assets/banner.html')+'?lang='+l);await p.evaluate(()=>document.fonts.ready);await p.locator('.banner').screenshot({path:'../docs/assets/banner.'+l+'.png',omitBackground:true})}await b.close()})()"
-->
<html lang="ko">
<head>
<meta charset="utf-8">
<title>Chagokmoa banner</title>
<style>
  @font-face {
    font-family: 'Pretendard';
    src: url('../../web/node_modules/pretendard/dist/web/variable/woff2/PretendardVariable.woff2') format('woff2-variations');
    font-weight: 45 920;
  }
  :root {
    --sky: #fff8f2;
    --sun: #ffe6d1;
    --cloud: #ffffff;
    --hill-1: #ffe6d1;
    --hill-2: #ffd7b8;
    --hill-3: #ffc69c;
    --plant: #f2a877;
    --stem: #e8925a;
    --brand: #3a1f07;
    --intro: #4a3426;
    --primary: #ff9e57;
  }
  html, body { margin: 0; background: transparent; }
  body { padding: 24px; font-family: 'Pretendard', sans-serif; }
  .banner {
    position: relative;
    width: 1200px;
    height: 320px;
    overflow: hidden;
    border-radius: 28px;
    background: var(--sky);
  }
  .banner > svg { position: absolute; inset: 0; width: 100%; height: 100%; }
  .content {
    position: absolute;
    inset: 0 0 64px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 14px;
  }
  .brand { position: relative; display: flex; align-items: center; gap: 16px; }
  .brand img { width: 76px; height: 76px; }
  .brand .name {
    font-size: 52px;
    font-weight: 700;
    line-height: 1.2;
    letter-spacing: -0.02em;
    color: var(--brand);
  }
  .sparkle { position: absolute; left: -34px; top: -26px; width: 38px; height: 38px; color: var(--primary); }
  .tagline {
    margin: 0;
    text-align: center;
    font-size: 24px;
    line-height: 1.55;
    color: var(--intro);
  }
  .tagline em { position: relative; display: inline-block; font-style: normal; font-weight: 700; color: var(--brand); }
  .tagline em svg { position: absolute; bottom: -7px; left: -2px; width: calc(100% + 4px); height: 13px; color: var(--primary); }
  .heart { display: inline-block; width: 28px; height: 28px; margin-left: 2px; vertical-align: -5px; color: var(--primary); }
  [data-lang]:not(.on) { display: none; }
</style>
</head>
<body>
<div class="banner">
  <svg viewBox="0 0 1200 320" preserveAspectRatio="none" aria-hidden="true">
    <circle fill="var(--sun)" cx="1000" cy="82" r="50"/>
    <g fill="var(--cloud)" transform="translate(196 132) scale(0.72) translate(-206 -320)">
      <ellipse cx="206" cy="336" rx="96" ry="26"/>
      <circle cx="166" cy="320" r="30"/>
      <circle cx="218" cy="302" r="42"/>
      <circle cx="262" cy="326" r="24"/>
    </g>
    <g fill="var(--cloud)" transform="translate(1046 142) scale(0.72) translate(-1096 -254)">
      <ellipse cx="1096" cy="268" rx="84" ry="22"/>
      <circle cx="1062" cy="254" r="26"/>
      <circle cx="1106" cy="238" r="36"/>
      <circle cx="1146" cy="258" r="20"/>
    </g>
    <!-- 언덕: 로그인 화면 1280 장면 언덕을 배너 너비, 낮은 높이로 줄여 아래에 붙임 -->
    <g transform="translate(0 320) scale(0.9375 0.6) translate(0 -880)">
      <path fill="var(--hill-1)" d="M0 750 C 160 690, 320 700, 450 746 S 780 800, 920 744 S 1170 676, 1280 702 L1280 880 L0 880 Z"/>
      <path fill="var(--hill-2)" d="M0 812 C 200 766, 390 782, 570 818 S 910 840, 1090 800 S 1240 776, 1280 786 L1280 880 L0 880 Z"/>
      <path fill="var(--hill-3)" d="M0 856 C 260 830, 520 846, 760 860 S 1100 840, 1280 848 L1280 880 L0 880 Z"/>
    </g>
    <!-- 풀: AuthBackdrop Plant 와 같은 모양 -->
    <g fill="var(--plant)" stroke="var(--stem)" stroke-width="4" stroke-linecap="round" transform="translate(104 324) scale(0.72)">
      <path d="M0 0 C 2 -40, 10 -84, 30 -124" fill="none"/>
      <ellipse cx="-12" cy="-40" rx="8" ry="19" transform="rotate(-38 -12 -40)" stroke="none"/>
      <ellipse cx="22" cy="-58" rx="8" ry="19" transform="rotate(34 22 -58)" stroke="none"/>
      <ellipse cx="2" cy="-86" rx="7" ry="17" transform="rotate(-30 2 -86)" stroke="none"/>
      <ellipse cx="34" cy="-108" rx="7" ry="16" transform="rotate(40 34 -108)" stroke="none"/>
      <path d="M60 4 C 62 -20, 66 -40, 78 -60" fill="none"/>
      <ellipse cx="54" cy="-24" rx="6" ry="14" transform="rotate(-36 54 -24)" stroke="none"/>
      <ellipse cx="80" cy="-38" rx="6" ry="14" transform="rotate(36 80 -38)" stroke="none"/>
    </g>
    <g fill="var(--plant)" stroke="var(--stem)" stroke-width="4" stroke-linecap="round" transform="translate(1094 326) scale(-0.72 0.72)">
      <path d="M0 0 C 2 -40, 10 -84, 30 -124" fill="none"/>
      <ellipse cx="-12" cy="-40" rx="8" ry="19" transform="rotate(-38 -12 -40)" stroke="none"/>
      <ellipse cx="22" cy="-58" rx="8" ry="19" transform="rotate(34 22 -58)" stroke="none"/>
      <ellipse cx="2" cy="-86" rx="7" ry="17" transform="rotate(-30 2 -86)" stroke="none"/>
      <ellipse cx="34" cy="-108" rx="7" ry="16" transform="rotate(40 34 -108)" stroke="none"/>
    </g>
  </svg>
  <div class="content">
    <div class="brand">
      <svg class="sparkle" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true">
        <path d="M14 4 L15.5 9"/><path d="M6 8 L10 11"/><path d="M3 16 L8 16"/>
      </svg>
      <img src="../../web/public/icon.svg" alt="">
      <span class="name" data-lang="ko">차곡모아</span>
      <span class="name" data-lang="en">Chagokmoa</span>
    </div>
    <p class="tagline" data-lang="ko">우리 아이의 하루하루를<br><em>차곡차곡<svg viewBox="0 0 80 10" preserveAspectRatio="none" aria-hidden="true"><path d="M2 7 C 20 3, 46 2, 78 5" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"/></svg></em> 모아 두는 곳<svg class="heart" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 19 C 5 14, 3 10.5, 4.5 7.5 C 6 4.8, 10 5, 12 8.5 C 14 5, 18 4.8, 19.5 7.5 C 21 10.5, 19 14, 12 19 Z" transform="rotate(12 12 12)"/></svg></p>
    <p class="tagline" data-lang="en">Where your little one's days<br>add up, <em>one by one<svg viewBox="0 0 80 10" preserveAspectRatio="none" aria-hidden="true"><path d="M2 7 C 20 3, 46 2, 78 5" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"/></svg></em><svg class="heart" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 19 C 5 14, 3 10.5, 4.5 7.5 C 6 4.8, 10 5, 12 8.5 C 14 5, 18 4.8, 19.5 7.5 C 21 10.5, 19 14, 12 19 Z" transform="rotate(12 12 12)"/></svg></p>
  </div>
</div>
<script>
  const lang = new URLSearchParams(location.search).get('lang') === 'en' ? 'en' : 'ko';
  document.documentElement.lang = lang;
  document.querySelectorAll('[data-lang="' + lang + '"]').forEach((el) => el.classList.add('on'));
</script>
</body>
</html>
